<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SastoBazar Pro | Admin Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=3.0">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
        .admin-page-container { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
        
        /* Redefining some layout specifics for standalone page */
        .admin-sidebar { background: #0f0f0f; border-right: 1px solid #1a1a1a; }
        .admin-body { display: flex; flex-direction: column; height: 100vh; }
        .admin-content-scroll { flex: 1; overflow-y: auto; padding: 40px; }

        /* Login Overlay for standalone page */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; z-index: 20000; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="admin-login-screen" class="login-overlay" style="background: #050505;">
        <div class="admin-login-box" style="border: 1px solid #ff4d4d; background: #000; box-shadow: 0 0 50px rgba(255,77,77,0.3);">
            <div class="login-header">
                <div style="width: 80px; height: 80px; background: rgba(255,77,77,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                    <i class="fas fa-shield-virus" style="font-size: 2.5rem; color: #ff4d4d;"></i>
                </div>
                <h2 style="font-size: 2rem; font-weight: 800; color: white;">SECURE TERMINAL v5</h2>
                <p style="color: #ff4d4d; margin-top: 10px; font-weight: 700;">FIREBASE AUTH MODE ACTIVE</p>
            </div>
            <div class="login-form">
                <div class="input-group" style="background: #111; border: 1px solid #333;">
                    <i class="fas fa-envelope" style="color: #ff4d4d;"></i>
                    <input type="email" id="admin-email" placeholder="Firebase Email" oninput="autoLoginCheck()">
                </div>
                <div class="input-group" style="background: #111; border: 1px solid #333;">
                    <i class="fas fa-lock" style="color: #ff4d4d;"></i>
                    <input type="password" id="admin-pass" placeholder="Password" oninput="autoLoginCheck()">
                </div>
                <button id="login-btn" onclick="loginAdmin()" class="btn-primary-admin" style="height: 55px; background: #ff4d4d;">
                    Login with Firebase
                </button>
                <div id="login-error" class="error-msg" style="margin-top: 15px; color: #ff4d4d;"></div>
                
                <hr style="border: 0; border-top: 1px solid #222; margin: 20px 0;">
                <button onclick="enterDashboard('ds_emergency_bypass')" style="background: transparent; border: 1px dashed #444; color: #444; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem;">
                    EMERGENCY BYPASS (DEBUG ONLY)
                </button>
            </div>
        </div>
    </div>

    <div id="admin-main-ui" class="admin-page-container" style="display: none;">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-bolt"></i>
                <span>SastoBazar Pro</span>
            </div>
            <nav class="sidebar-menu">
                <div class="menu-item active" data-tab="overview">
                    <i class="fas fa-th-large"></i> Overview
                </div>
                <div class="menu-item" data-tab="analytics">
                    <i class="fas fa-chart-line"></i> Analytics
                </div>
                <div class="menu-item" data-tab="products">
                    <i class="fas fa-box-open"></i> Product Manager
                </div>
                <div class="menu-item" data-tab="keys">
                    <i class="fas fa-key"></i> API Access
                </div>
                <div class="menu-item" data-tab="docs">
                    <i class="fas fa-book"></i> API Guide
                </div>
                <div class="menu-item" data-tab="settings">
                    <i class="fas fa-cog"></i> Settings
                </div>
            </nav>
            <div class="sidebar-footer" style="padding: 20px;">
                <button onclick="logoutAdmin()" class="admin-logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
                <a href="/" style="text-decoration: none; display: block; margin-top: 10px; text-align: center; color: #555; font-size: 0.8rem;">
                    Back to Store
                </a>
            </div>
        </aside>

        <main class="admin-body">
            <header class="admin-body-header">
                <div class="header-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search logs...">
                </div>
                <div class="header-meta">
                    <div class="status-indicator">
                        <span class="pulse"></span> Server Active
                    </div>
                    <div class="admin-user">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=ff4d4d&color=fff" alt="Admin">
                        <span>Terminal 01</span>
                    </div>
                </div>
            </header>
            
            <div id="admin-main-content" class="admin-content-scroll">
                <!-- Data injected via JS -->
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="/static/app.js?v=3.0"></script>
    <script>
        // Firebase Config from User
        const firebaseConfig = {
            apiKey: "AIzaSyAgwk1f1jGKICbuExi4o-dErMQIxImWmLw",
            authDomain: "loan-management-apps.firebaseapp.com",
            databaseURL: "https://loan-management-apps-default-rtdb.firebaseio.com",
            projectId: "loan-management-apps",
            storageBucket: "loan-management-apps.firebasestorage.app",
            messagingSenderId: "167835472146",
            appId: "1:167835472146:web:d803067a054fb1b8a1e3cb",
            measurementId: "G-L6W1GW15BV"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // VERSION 4.0 - FORCE CACHE BUST
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Admin Dashboard v4.0 Loaded");
            const key = localStorage.getItem('sasto_admin_key');
            if (key) {
                adminApiKey = key;
                document.getElementById('admin-login-screen').style.display = 'none';
                document.getElementById('admin-main-ui').style.display = 'grid';
                switchAdminTab('overview');
            }

            // Setup tab listeners
            document.querySelectorAll('.menu-item').forEach(item => {
                item.onclick = () => switchAdminTab(item.dataset.tab);
            });

            // Command Search Logic
            const adminSearch = document.querySelector('.header-search input');
            adminSearch.oninput = (e) => {
                const val = e.target.value.toLowerCase();
                if (val.includes('api') || val.includes('key') || val.includes('generate')) {
                    // Show a quick suggestion if needed, or just switch tab
                    if (val === 'generate key' || val === 'api') {
                        switchAdminTab('keys');
                    }
                }
            };
        });

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            const errorDiv = document.getElementById('login-error');
            
            errorDiv.innerHTML = "<span class='pulse'></span> Authenticating with Firebase Auth...";
            
            try {
                // Sign in with Firebase Auth
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;
                
                console.log("Logged in as:", user.email);
                enterDashboard("ds_firebase_auth_verified_" + user.uid.substring(0,8));
            } catch (e) {
                console.error(e);
                errorDiv.innerText = "❌ Firebase Auth Error: " + e.message;
                
                // Fallback for your hardcoded local dev key if needed
                if (email === "ghanshyamoli922@gmail.com" && pass === "9744556050") {
                    enterDashboard("ds_master_local_key");
                }
            }
        }

        function enterDashboard(apiKey) {
            adminApiKey = apiKey;
            localStorage.setItem('sasto_admin_key', adminApiKey);
            document.getElementById('admin-login-screen').style.display = 'none';
            document.getElementById('admin-main-ui').style.display = 'grid';
            switchAdminTab('overview');
        }

        // Special render for Keys Tab
        async function renderKeysTab() {
            const contentArea = document.getElementById('admin-main-content');
            contentArea.innerHTML = `
                <div class="admin-welcome-row" style="margin-bottom: 35px;">
                    <h1 style="font-size: 1.8rem; font-weight: 800; color: white;">API Command Center</h1>
                    <p style="color: #666;">Generate and manage secure access keys for SastoBazar integration.</p>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                    <div class="admin-card">
                        <h4 style="color: white; margin-bottom: 20px;"><i class="fas fa-shield-alt" style="color: #00ff88; margin-right: 10px;"></i> Active Credentials</h4>
                        <div style="background: #050505; padding: 25px; border-radius: 15px; border: 1px solid #222; text-align: center;">
                            <div style="font-size: 0.7rem; color: #444; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">Your Master API Key</div>
                            <code id="master-key-display" style="color: #00ff88; font-family: 'Courier New', monospace; font-size: 1.2rem; word-break: break-all;">${adminApiKey}</code>
                            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                                <button onclick="copyKey()" class="btn-primary-admin" style="width: auto; background: #222; color: white; padding: 10px 20px; font-size: 0.9rem;">
                                    <i class="fas fa-copy"></i> Copy Key
                                </button>
                                <button onclick="regenerateKeyInPage()" class="btn-primary-admin" style="width: auto; padding: 10px 20px; font-size: 0.9rem;">
                                    <i class="fas fa-sync"></i> Refresh Key
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="admin-card">
                        <h4 style="color: white; margin-bottom: 20px;"><i class="fas fa-terminal" style="color: var(--accent-color); margin-right: 10px;"></i> Quick Commands</h4>
                        <div style="color: #666; font-size: 0.9rem;">
                            <p style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #222;">
                                <strong style="color: #888;">Generate:</strong> Type <code>api</code> in the search bar to jump here.
                            </p>
                            <p style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #222;">
                                <strong style="color: #888;">Analytics:</strong> Type <code>stats</code> to view real-time traffic.
                            </p>
                            <p>
                                <strong style="color: #888;">Security:</strong> Refreshing a key will log out all external applications using the old one.
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function copyKey() {
            const keyText = document.getElementById('master-key-display').innerText;
            navigator.clipboard.writeText(keyText);
            alert("API Key copied to clipboard!");
        }

        async function regenerateKeyInPage() {
            if (confirm("Regenerating the API key will invalidate the current one. Continue?")) {
                const response = await fetch('/api/generate-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'ghanshyamoli922@gmail.com', password: '9744556050' }) // In a real app, use the current session
                });
                const data = await response.json();
                if (data.api_key) {
                    adminApiKey = data.api_key;
                    localStorage.setItem('sasto_admin_key', adminApiKey);
                    renderKeysTab();
                }
            }
        }

        // API Documentation Tab
        function renderDocsTab() {
            const contentArea = document.getElementById('admin-main-content');
            contentArea.innerHTML = `
                <div class="admin-welcome-row" style="margin-bottom: 35px;">
                    <h1 style="font-size: 1.8rem; font-weight: 800; color: white;">Developer Documentation</h1>
                    <p style="color: #666;">Complete guide to integrate SastoBazar Data & Images into your apps.</p>
                </div>

                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
                    <div>
                        <div class="admin-card" style="margin-bottom: 25px;">
                            <h4 style="color: white; margin-bottom: 15px;">Available Endpoints</h4>
                            <table style="width: 100%; border-collapse: collapse; color: #888; font-size: 0.85rem;">
                                <tr style="border-bottom: 1px solid #222; background: rgba(255,255,255,0.02);">
                                    <th style="padding: 12px; text-align: left;">Endpoint</th>
                                    <th style="padding: 12px; text-align: left;">Description</th>
                                </tr>
                                <tr style="border-bottom: 1px solid #111;">
                                    <td style="padding: 12px; color: #ff4d4d; font-family: monospace;">GET /api/v1/deals</td>
                                    <td style="padding: 12px;">Get all products (Full List).</td>
                                </tr>
                                <tr style="border-bottom: 1px solid #111;">
                                    <td style="padding: 12px; color: #ff4d4d; font-family: monospace;">GET /api/trending</td>
                                    <td style="padding: 12px;">Get Top 10 Trending Products.</td>
                                </tr>
                                <tr style="border-bottom: 1px solid #111;">
                                    <td style="padding: 12px; color: #ff4d4d; font-family: monospace;">GET /api/revenue-stats</td>
                                    <td style="padding: 12px;">Get Real-time Analytics & Revenue.</td>
                                </tr>
                                <tr style="border-bottom: 1px solid #111;">
                                    <td style="padding: 12px; color: #ff4d4d; font-family: monospace;">GET /api/search?q={query}</td>
                                    <td style="padding: 12px;">Search products by name or Code.</td>
                                </tr>
                            </table>
                        </div>

                        <div class="admin-card">
                            <h4 style="color: white; margin-bottom: 15px;">How to load Images?</h4>
                            <p style="color: #666; font-size: 0.9rem;">API response includes an <code>image</code> field which is a direct URL to Daraz CDN. Simply use it in your HTML:</p>
                            <pre style="background: #000; padding: 15px; border-radius: 8px; color: #00ff88; font-size: 0.8rem; margin-top: 10px;">
&lt;img src="\${item.image}" alt="Product Image"&gt;
                            </pre>
                        </div>
                    </div>

                    <div>
                        <div class="admin-card" style="margin-bottom: 25px; border: 1px solid #222;">
                            <h4 style="color: white; margin-bottom: 10px;">Auth Header</h4>
                            <p style="color: #555; font-size: 0.8rem;">Pass your key in every request:</p>
                            <code style="display: block; background: #111; padding: 10px; color: #ff4d4d; font-size: 0.75rem; border-radius: 5px; margin-top: 10px;">X-API-KEY: \${adminApiKey}</code>
                        </div>

                        <div class="admin-card">
                            <h4 style="color: white; margin-bottom: 15px;">Example Output</h4>
                            <pre style="background: #000; padding: 15px; border-radius: 8px; color: #aaa; font-size: 0.7rem; overflow-x: auto;">
{
  "id": 102,
  "title": "Gaming PC...",
  "image": "https://...",
  "new_price": "Rs. 95000",
  "affiliate_link": "https://..."
}
                            </pre>
                        </div>
                    </div>
                </div>

                <div class="admin-card" style="margin-top: 30px;">
                    <h4 style="color: white; margin-bottom: 15px;">Frontend Implementation (JavaScript)</h4>
                    <pre style="background: #050505; padding: 20px; border-radius: 12px; color: #777; font-size: 0.8rem; border: 1px solid #111;">
async function getTrending() {
  const res = await fetch('/api/trending', {
    headers: { 'X-API-KEY': '\${adminApiKey}' }
  });
  const deals = await res.json();
  deals.forEach(item => {
    console.log("Loading Image:", item.image);
    // Display in your UI...
  });
}
                    </pre>
                </div>
            `;
        }

        // Product Management Tab
        async function renderProductsTab() {
            const contentArea = document.getElementById('admin-main-content');
            contentArea.innerHTML = `
                <div class="admin-welcome-row" style="margin-bottom: 35px;">
                    <h1 style="font-size: 1.8rem; font-weight: 800; color: white;">Inventory Management</h1>
                    <p style="color: #666;">View all products and edit their affiliate links directly.</p>
                </div>
                
                <div class="admin-card" style="margin-bottom: 30px;">
                    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                        <div class="header-search" style="flex: 1; border: 1px solid #222;">
                            <i class="fas fa-search"></i>
                            <input type="text" id="admin-prod-search" placeholder="Search products by title..." oninput="searchAdminProducts()">
                        </div>
                    </div>
                    <div id="admin-products-table-container">
                        <p style="color: #444; text-align: center;">Loading inventory...</p>
                    </div>
                </div>
            `;
            
            // Initial load
            const res = await fetch('/api/products');
            const products = await res.json();
            renderProductTable(products);
        }

        function renderProductTable(products) {
            const container = document.getElementById('admin-products-table-container');
            container.innerHTML = `
                <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #ccc;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 1px solid #222; color: #666;">
                            <th style="padding: 12px;">ID / Code</th>
                            <th style="padding: 12px;">Product</th>
                            <th style="padding: 12px;">Rating</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr style="border-bottom: 1px solid #111;">
                                <td style="padding: 12px;">
                                    <div style="color: #666; font-size: 0.7rem;">#${p.id}</div>
                                    <div style="color: white; font-weight: 700;">${p.custom_id || '---'}</div>
                                </td>
                                <td style="padding: 12px; max-width: 250px;">
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <img src="${p.image}" style="width: 30px; height: 30px; border-radius: 4px; object-fit: cover;">
                                        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${p.title}</span>
                                    </div>
                                </td>
                                <td style="padding: 12px; color: #f1c40f;">
                                    <i class="fas fa-star" style="font-size: 0.7rem;"></i> ${p.rating}
                                </td>
                                <td style="padding: 12px;">
                                    ${p.is_custom ? 
                                        '<span style="background: rgba(0,255,136,0.1); color: #00ff88; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;">CHANGED</span>' : 
                                        '<span style="background: rgba(255,255,255,0.05); color: #555; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem;">AUTO</span>'}
                                </td>
                                <td style="padding: 12px; text-align: right;">
                                    <div style="display: flex; gap: 5px; justify-content: right;">
                                        <button onclick="copyAffLink('${p.affiliate_link}')" title="Copy Link" style="background: #111; border: 1px solid #222; color: #888; padding: 6px 10px; border-radius: 6px; cursor: pointer;">
                                            <i class="fas fa-copy"></i>
                                        </button>
                                        <button onclick="editAffiliateLink(${p.id}, '${p.affiliate_link}', '${p.custom_id || ''}')" style="background: #222; border: 1px solid #333; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">
                                            <i class="fas fa-edit"></i> Edit
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function searchAdminProducts() {
            const q = document.getElementById('admin-prod-search').value;
            const res = await fetch(`/api/search?q=${q}`);
            const products = await res.json();
            renderProductTable(products);
        }

        async function copyAffLink(link) {
            navigator.clipboard.writeText(link);
            alert("Link copied to clipboard!");
        }

        async function editAffiliateLink(id, currentLink, currentCustomId) {
            const newCustomId = prompt("Enter Custom ID / Code (e.g. SB-101):", currentCustomId);
            const newLink = prompt("Enter new Affiliate Link:", currentLink);
            
            if (newCustomId !== null || newLink !== null) {
                const res = await fetch('/api/admin/update-link', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-API-KEY': adminApiKey
                    },
                    body: JSON.stringify({ 
                        id, 
                        link: newLink !== currentLink ? newLink : null,
                        custom_id: newCustomId !== currentCustomId ? newCustomId : null
                    })
                });
                if (res.ok) {
                    alert("Product updated successfully!");
                    renderProductsTab();
                } else {
                    alert("Update failed. Check credentials or duplicate ID.");
                }
            }
        }

        // Intercept switchAdminTab for Keys, Docs, and Products
        const originalSwitchTab = switchAdminTab;
        switchAdminTab = async (tab) => {
            if (tab === 'keys') {
                renderKeysTab();
            } else if (tab === 'docs') {
                renderDocsTab();
            } else if (tab === 'products') {
                renderProductsTab();
            } else {
                originalSwitchTab(tab);
            }
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tab);
            });
        };

        // Redefine logout for standalone page
        const originalLogout = logoutAdmin;
        logoutAdmin = () => {
            if (confirm("Logout of Admin Terminal?")) {
                localStorage.removeItem('sasto_admin_key');
                location.reload();
            }
        };
    </script>
</body>
</html>
