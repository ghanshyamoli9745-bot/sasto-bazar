<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealSathi | Product Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=2.0">
    <style>
        .detail-wrapper {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }
        .back-nav {
            margin-bottom: 30px;
        }
        .back-btn {
            color: #888;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .back-btn:hover { color: white; }
        
        .detail-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .detail-visual {
            position: relative;
        }
        
        .detail-visual img {
            width: 100%;
            border-radius: 20px;
            object-fit: cover;
            border: 1px solid #333;
        }
        
        .detail-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--accent-gradient);
            color: black;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 10px 20px rgba(255, 77, 77, 0.3);
        }

        .detail-info h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
            color: white;
        }

        .detail-price-box {
            margin: 25px 0;
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .cur-price {
            font-size: 3rem;
            font-weight: 900;
            color: var(--price-color);
        }

        .was-price {
            font-size: 1.4rem;
            color: #555;
            text-decoration: line-through;
        }

        .detail-meta {
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            border: 1px solid #252525;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .meta-label { color: #666; }
        .meta-value { color: #bbb; text-transform: capitalize; font-weight: 600; }

        .detail-actions {
            display: flex;
            gap: 15px;
        }

        .btn-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            background: var(--accent-gradient);
            color: black;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 1.1rem;
            transition: 0.3s;
            border: none;
        }
        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.4);
        }

        .btn-fav-large {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-fav-large:hover { color: white; border-color: #555; }
        .btn-fav-large.active { background: #ff4d4d; color: white; border-color: #ff4d4d; }

        @media (max-width: 850px) {
            .detail-card { grid-template-columns: 1fr; gap: 30px; padding: 25px; }
            .cur-price { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="detail-wrapper">
        <div class="back-nav">
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Deals</a>
        </div>
        <div id="product-root">
             <div style="text-align: center; padding: 100px; color: #555;">Loading premium deal...</div>
        </div>
    </div>

    <script src="/static/app.js?v=2.0"></script>
    <script>
        const productId = {{ product_id }};
        
        async function initDetail() {
            try {
                const response = await fetch(`/api/product/${productId}`);
                const product = await response.json();
                renderProduct(product);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderStars(rating) {
            const score = parseFloat(rating) || 0;
            if (score === 0) return '<span style="color:#666">No reviews yet</span>';
            
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= score) {
                    stars += '<i class="fas fa-star" style="color:#f9cb28"></i>';
                } else if (i - 0.5 <= score) {
                    stars += '<i class="fas fa-star-half-alt" style="color:#f9cb28"></i>';
                } else {
                    stars += '<i class="far fa-star" style="color:#555"></i>';
                }
            }
            return `${stars} <span style="margin-left:5px; color:#fff">${score}</span>`;
        }

        function renderProduct(product) {
            const root = document.getElementById('product-root');
            const isFav = (JSON.parse(localStorage.getItem('daraz_favorites')) || []).some(p => p.title === product.title);
            const prodStr = JSON.stringify(product).replace(/'/g, "&apos;").replace(/"/g, '&quot;');

            root.innerHTML = `
                <div class="detail-card">
                    <div class="detail-visual">
                        ${product.discount_percent ? `<div class="detail-badge">${product.discount_percent} OFF</div>` : ''}
                        <img src="${product.image}" alt="${product.title}">
                    </div>
                    <div class="detail-info">
                        <h2>${product.title}</h2>
                        
                        <div class="detail-price-box">
                            <span class="cur-price">${product.new_price}</span>
                            ${product.old_price ? `<span class="was-price">${product.old_price}</span>` : ''}
                        </div>

                        <div class="detail-meta">
                            <div class="meta-item">
                                <span class="meta-label">Category</span>
                                <span class="meta-value">${product.category.replace('-', ' ')}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Rating</span>
                                <span class="meta-value" id="star-rating-container">
                                    ${renderStars(product.rating)}
                                </span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Status</span>
                                <span class="meta-value" style="color:#00ff88">Verified Deal</span>
                            </div>
                        </div>

                        <div class="detail-actions">
                            <a href="${product.affiliate_link}" target="_blank" class="btn-main" onclick="trackClick(${product.id})">
                                <i class="fas fa-bolt"></i> GRAB THIS DEAL
                            </a>
                            <button onclick='toggleFavorite(${prodStr})' class="btn-fav-large ${isFav ? 'active' : ''}" id="detail-fav-btn">
                                <i class="fa${isFav ? 's' : 'r'} fa-heart"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        initDetail();
    </script>
</body>
</html>
